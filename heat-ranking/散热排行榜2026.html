function render(id,data,type){
 const el=document.getElementById(id);
 let h='';
 data.forEach(g=>{
  h+=`<div class="level-section"><div class="level-header"><h2>${g.g}</h2><span class="level-badge ${g.c}">${g.b}</span></div><div class="product-grid">`;
  g.p.forEach((p,i)=>{
   h+=`<div class="product-card"><div class="rank-circle ${rk(i)}">${i+1}</div><div class="score-badge">★ ${p.sc}</div><div class="product-img">${imgH(p.i,p.n,type)}</div><div class="product-body"><div class="product-name">${p.n}</div><div class="product-tags"><span class="tag tag-price">${p.pr}</span><span class="tag tag-spec">${p.sp}</span></div><div class="product-desc">${p.d}</div><div class="product-links">${p.j?'<a href="'+p.j+'" target="_blank" class="btn-link btn-jd">🛒 京东购买</a>':''}${p.z?'<a href="'+p.z+'" target="_blank" class="btn-link btn-zol">📖 ZOL详情</a>':''}${!p.j&&!p.z?'<span style="color:var(--muted);font-size:.8em">暂无直链</span>':''}</div></div></div>`
  });
  h+='</div></div>'
 });
 el.innerHTML=h;
}
